name: ViralSpawnTV - Calibrate Library Screen (No OpenAI)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: viralspawntv-library-calibration
  cancel-in-progress: false
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ''
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DOWNLOAD_TIMEOUT: '60'
      HF_HUB_ETAG_TIMEOUT: '30'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/viralspawntv-ffmpeg
            ~/.cache/viralspawntv-models
          key: viralspawntv-local-models-v2-${{ runner.os }}
      - name: Install local dependencies
        run: python -m pip install -r requirements_local_screen.txt
      - name: Compare crops and generic prompts on frozen examples
        run: python calibrate_library_screen.py
      - name: Save calibration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viralspawntv-library-calibration
          retention-days: 7
          if-no-files-found: warn
          path: work/library_calibration/
