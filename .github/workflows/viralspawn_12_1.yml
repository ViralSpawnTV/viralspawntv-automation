name: ViralSpawnTV Shorts V12.1 - 12 Per Day

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

concurrency:
  group: viralspawntv-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Produce V12.1 Short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python v12_1_pipeline.py

      - name: Upload public Short
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python youtube_upload.py

      - name: Persist successful Short history
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f history.json ]; then
            echo "history.json was not created."
            exit 1
          fi

          cp history.json /tmp/history_after_upload.json

          git fetch origin main
          git reset --hard origin/main

          python - <<'PY'
          import json
          from pathlib import Path

          latest_path = Path("history.json")
          uploaded_path = Path("/tmp/history_after_upload.json")

          def load_history(path):
              if not path.exists():
                  return {"version": 1, "used_clips": []}

              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return {"version": 1, "used_clips": []}

              if isinstance(data, list):
                  return {
                      "version": 1,
                      "used_clips": data
                  }

              if not isinstance(data, dict):
                  return {
                      "version": 1,
                      "used_clips": []
                  }

              clips = data.get("used_clips")

              if not isinstance(clips, list):
                  clips = []

              data["version"] = data.get("version", 1)
              data["used_clips"] = clips

              return data

          latest = load_history(latest_path)
          uploaded = load_history(uploaded_path)

          latest_clips = latest["used_clips"]
          uploaded_clips = uploaded["used_clips"]

          existing_clip_ids = {
              str(item.get("clip_id"))
              for item in latest_clips
              if isinstance(item, dict) and item.get("clip_id")
          }

          existing_urls = {
              str(item.get("clip_url") or item.get("source"))
              for item in latest_clips
              if isinstance(item, dict)
              and (item.get("clip_url") or item.get("source"))
          }

          added = 0

          for item in uploaded_clips:
              if not isinstance(item, dict):
                  continue

              clip_id = item.get("clip_id")
              clip_url = item.get("clip_url") or item.get("source")

              if clip_id and str(clip_id) in existing_clip_ids:
                  continue

              if clip_url and str(clip_url) in existing_urls:
                  continue

              latest_clips.append(item)
              added += 1

              if clip_id:
                  existing_clip_ids.add(str(clip_id))

              if clip_url:
                  existing_urls.add(str(clip_url))

          latest["used_clips"] = latest_clips

          latest_path.write_text(
              json.dumps(
                  latest,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8"
          )

          print(f"Merged {added} new history entr{'y' if added == 1 else 'ies'}.")
          print(f"Total history entries: {len(latest_clips)}")
          PY

          git config user.name "ViralSpawnTV Automation"
          git config user.email "actions@users.noreply.github.com"

          git add history.json

          if git diff --cached --quiet -- history.json; then
            echo "History entry already exists on main. Nothing to commit."
            exit 0
          fi

          git commit -m "Record published ViralSpawnTV Short"
          git push origin HEAD:main

          echo "history.json successfully merged and persisted."

      - name: Upload V12.1 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viralspawntv-v12-1-production
          retention-days: 7
          path: |
            history.json
            work/v11_candidate_manifest.json
            work/v12_ranked_candidates.json
            work/v12_attempt_log.json
            work/kick_gaming/acquisition_result.json
            work/viral_gate/viral_gate_result.json
            work/music_gate/music_gate_result.json
            work/production/final_content_gate.json
            work/production/ViralSpawnTV_Short_V4.mp4
            work/production/ViralSpawnTV_V4_metadata.json
            work/production/youtube_upload_result.json
