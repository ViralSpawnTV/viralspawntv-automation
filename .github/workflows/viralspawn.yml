name: ViralSpawnTV Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  short:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Kick acquisition test
        run: python kick_download_test.py

      - name: Upload Kick result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kick-test-result
          path: work/kick_downloads/
          if-no-files-found: warn
