name: ViralSpawnTV Gaming V4 + Private YouTube Upload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  produce-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ========================================================
      # 1. ACQUIRE GAMING CLIP FROM KICK
      # ========================================================

      - name: Acquire Kick gaming clip
        run: python kick_gaming_acquisition.py

      - name: Verify Kick gaming source
        run: |
          test -f work/kick_gaming/selected_kick_gaming_source.mp4
          test -f work/kick_gaming/acquisition_result.json

          echo "Kick gaming source acquired."
          ls -lh work/kick_gaming/selected_kick_gaming_source.mp4
          cat work/kick_gaming/acquisition_result.json

      # ========================================================
      # 2. CREATE VIRALSPAWNTV V4 GAMING SHORT
      # ========================================================

      - name: Produce ViralSpawnTV gaming Short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python production_test.py

      - name: Verify finished gaming Short
        run: |
          test -f work/production/ViralSpawnTV_Short_V4.mp4
          test -f work/production/ViralSpawnTV_V4_metadata.json

          echo "Finished gaming Short found."
          ls -lh work/production/ViralSpawnTV_Short_V4.mp4

          echo "===== METADATA ====="
          cat work/production/ViralSpawnTV_V4_metadata.json

      # ========================================================
      # 3. PRIVATE YOUTUBE UPLOAD
      # ========================================================

      - name: Upload gaming Short to YouTube as PRIVATE
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python youtube_upload.py

      # ========================================================
      # 4. SAVE EVERYTHING FOR QC
      # ========================================================

      - name: Collect Kick source artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viralspawntv-kick-source
          path: work/kick_gaming/
          if-no-files-found: warn
          retention-days: 7

      - name: Collect finished gaming production
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viralspawntv-gaming-v4-production
          path: work/production/
          if-no-files-found: warn
          retention-days: 7
