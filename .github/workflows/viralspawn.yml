name: ViralSpawnTV V4 + Private YouTube Upload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  produce-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Produce ViralSpawnTV V4 Short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python production_test.py

      - name: Verify finished video
        run: |
          test -f work/production/ViralSpawnTV_Short_V4.mp4
          echo "V4 video found."
          ls -lh work/production/ViralSpawnTV_Short_V4.mp4

      - name: Upload V4 Short to YouTube as PRIVATE
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python youtube_upload.py

      - name: Upload production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viralspawntv-v4-youtube-test
          path: work/production/
          if-no-files-found: warn
          retention-days: 7
