name: ViralSpawnTV Long-Form V1.4 - Visual Activity Safe

on:
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * *"

concurrency:
  group: viralspawntv-longform
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  produce-longform:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Produce and publish V1.4
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python longform_pipeline_v1_4.py

      - name: Upload V1.4 diagnostics and episode
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viralspawntv-longform-v1-4-production
          retention-days: 7
          path: |
            work/v11_candidate_manifest.json
            work/longform/ranked_sources.json
            work/longform/acquired_sources.json
            work/longform/screened_sources.json
            work/longform/ViralSpawnTV_Longform_V1_4.mp4
            work/longform/ViralSpawnTV_Longform_V1_4_metadata.json
            work/longform/youtube_longform_upload_result_v1_4.json
