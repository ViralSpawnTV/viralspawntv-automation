name: ViralSpawnTV - Build 5000 Clip Library (No OpenAI)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Scan budget in minutes (3-240); progress resumes next run'
        default: '120'
        required: true
        type: string
      max_scans:
        description: 'Maximum new local scans this run'
        default: '250'
        required: true
        type: string
  schedule:
    - cron: '35 5 * * *'

permissions:
  contents: write

concurrency:
  group: viralspawntv-discovery-library
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    env:
      OPENAI_API_KEY: ''
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
      SCAN_MINUTES: ${{ inputs.minutes || '120' }}
      MAX_SCANS: ${{ inputs.max_scans || '250' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/viralspawntv-ffmpeg
            ~/.cache/viralspawntv-models
          key: viralspawntv-local-models-v2-${{ runner.os }}
      - name: Reuse FFmpeg or install cached binaries
        timeout-minutes: 6
        run: bash ensure_ffmpeg.sh
      - name: Install local scanning dependencies
        run: python -m pip install -r requirements_local_screen.txt playwright
      - name: Validate local models before scanning
        timeout-minutes: 12
        env:
          HF_HUB_DOWNLOAD_TIMEOUT: '60'
          HF_HUB_ETAG_TIMEOUT: '30'
        run: python local_combat_screen.py --prepare
      - name: Build or resume locally screened library
        run: python build_clip_library.py --target 5000 --minutes "$SCAN_MINUTES" --max-scans "$MAX_SCANS"
      - name: Snapshot progress
        if: always()
        run: |
          mkdir -p /tmp/viralspawntv-library-save
          if [ -f data/clip_library.json ]; then
            cp data/clip_library.json /tmp/viralspawntv-library-save/library.json
            cp data/clip_library_state.json /tmp/viralspawntv-library-save/state.json
          fi
      - name: Commit library progress without overwriting Shorts history
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f /tmp/viralspawntv-library-save/library.json ]; then
            echo "No discovery progress to persist."
            exit 0
          fi
          git config user.name 'ViralSpawnTV Library'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # Generated progress is backed up above; reset only this disposable runner.
            git reset --hard HEAD
            git clean -f -- data/clip_library.json data/clip_library_state.json
            git fetch origin "$TARGET_BRANCH"
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
            python clip_library.py merge /tmp/viralspawntv-library-save/library.json /tmp/viralspawntv-library-save/state.json
            git add data/clip_library.json data/clip_library_state.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update locally screened clip library'
            if git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
          done
          echo 'Library persistence failed after three attempts. Download the progress artifact.'
          exit 1
      - name: Save recovery index and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viralspawntv-clip-library-progress
          retention-days: 7
          if-no-files-found: ignore
          path: |
            /tmp/viralspawntv-library-save/library.json
            /tmp/viralspawntv-library-save/state.json
            work/clip_library_summary.json
            work/clip_library_evidence.json
            work/local_model_setup_result.json
