name: ViralSpawnTV Gaming Selector Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gaming-selector:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run gaming selector
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python gaming_selector.py

      - name: Show selection report
        if: always()
        run: |
          echo "===== GAMING SELECTION REPORT ====="
          if [ -f work/production/gaming_selection.json ]; then
            cat work/production/gaming_selection.json
          else
            echo "No gaming_selection.json was created."
          fi

      - name: Upload selector report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viralspawntv-gaming-selector-test
          path: work/production/gaming_selection.json
          if-no-files-found: warn
          retention-days: 7
