name: ViralSpawnTV Long-Form V1.5 - Quality + Branding Safe

on:
  workflow_dispatch:

concurrency:
  group: viralspawntv-longform
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install chromium

      - name: Verify V1.5 branding assets
        run: |
          test -s viralspawntv_intro.png
          test -s viralspawntv_outro.png
          echo "ViralSpawnTV intro and outro assets found."

      - name: Run ViralSpawnTV Long-Form V1.5
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python longform_pipeline_v1_5.py

      - name: Upload V1.5 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viralspawntv-longform-v1-5
          if-no-files-found: warn
          retention-days: 7
          path: |
            work/v11_candidate_manifest.json
            work/longform/ranked_candidates.json
            work/longform/acquired_sources.json
            work/longform/screened_sources.json
            work/longform/quality_gate_v1_5.json
            work/longform/ViralSpawnTV_Longform_V1_5.mp4
            work/longform/ViralSpawnTV_Longform_V1_5_metadata.json
            work/longform/youtube_longform_upload_result_v1_5.json
